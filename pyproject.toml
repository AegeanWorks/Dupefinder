[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dupefinder"
version = "0.2.0"
description = "Read-only duplicate file finder that groups byte-identical files by size and SHA-256 and reports reclaimable space."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-AL-1.1" }
authors = [{ name = "AegeanWorks" }]
dependencies = []

[project.scripts]
dupefinder = "dupefinder.cli:main"

[tool.setuptools]
packages = ["dupefinder"]
